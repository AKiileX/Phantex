\* TLC Model Configuration for policy_engine.tla
\* Bounded model: 4 policies, 3 concurrent alerts, 2 tenants

SPECIFICATION Spec

\* -- Constants --
CONSTANT MaxPolicies     = 4
CONSTANT MaxAlerts       = 3
CONSTANT MaxActionsPerHour = 5
CONSTANT MaxEscLevel     = 4
CONSTANT Tenants         = {"t1", "t2"}

\* -- Invariants (Safety) --
INVARIANT TypeOK
INVARIANT KillSwitchSupremacy
INVARIANT ConsistentSnapshot
INVARIANT VersionMonotonic
INVARIANT EscalationMonotonic
INVARIANT AuditComplete
INVARIANT DeletedNeverMatch

\* -- Liveness Properties --
PROPERTY AlertEventualCompletion
PROPERTY PipelineProgress

\* -- Deadlock --
CHECK_DEADLOCK TRUE
