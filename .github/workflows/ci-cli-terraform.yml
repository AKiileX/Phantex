name: CLI & Terraform Provider CI

on:
  # push:                   # disabled — no CI infra yet
  #   branches: [main]
  #   paths:
  #     - 'cli/**'
  #     - 'terraform-provider-phantex/**'
  pull_request:
    paths:
      - 'cli/**'
      - 'terraform-provider-phantex/**'
  workflow_dispatch:          # manual trigger

jobs:
  cli-build:
    name: CLI Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o bin/phantex .

      - name: Test
        run: go test ./... -v -count=1

      - name: Cross-compile
        run: |
          GOOS=linux   GOARCH=amd64 go build -o bin/phantex-linux-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -o bin/phantex-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -o bin/phantex-windows-amd64.exe .

  terraform-provider:
    name: Terraform Provider Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform-provider-phantex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: terraform-provider-phantex/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o bin/terraform-provider-phantex .

      - name: Unit tests
        run: go test ./... -v -count=1

  cli-release:
    name: CLI Release Binaries
    needs: [cli-build]
    if: startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum

      - name: Build release binaries
        run: make cross

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: cli/bin/phantex-*
