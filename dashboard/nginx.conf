# Phantex Dashboard — Nginx configuration
#
# Serves the React SPA and proxies API + WebSocket to the backend.
# BACKEND_URL is set at container start (default: phantex-backend:8000).

# Rate limiting zone: 20 req/sec per IP for API endpoints
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen       80;
    server_name  _;
    server_tokens off;   # Hide nginx version from responses
    more_clear_headers Server;  # Completely remove the Server header (requires headers-more module)

    # Docker embedded DNS — re-resolve backend hostname at runtime
    # so a container IP change (restart / redeploy) never causes 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Explicit body size limit (defense-in-depth)
    client_max_body_size 1m;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── SPA routing (react-router) ────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Prevent caching of index.html ─────────────────────────
    # Vite chunks use content-hashes and are safely immutable,
    # but the HTML entry must always be fresh so the browser
    # loads the latest chunk manifest after each deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
        add_header X-Frame-Options        "DENY"    always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection       "0"       always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss:; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # ── API reverse proxy ─────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        # Using a variable forces nginx to re-resolve via the resolver
        # directive above, instead of caching the IP from config-load.
        set $backend_api http://phantex-backend:8000;
        proxy_pass         $backend_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Strip backend server identity — defense against fingerprinting (CWE-200)
        proxy_hide_header  Server;
        proxy_hide_header  X-Powered-By;
    }

    # ── GraphQL reverse proxy ─────────────────────────────────
    location /graphql {
        limit_req zone=api burst=20 nodelay;

        set $backend_gql http://phantex-backend:8000;
        proxy_pass         $backend_gql;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        proxy_hide_header  Server;
        proxy_hide_header  X-Powered-By;
    }

    # ── WebSocket reverse proxy ───────────────────────────────
    location /ws/ {
        set $backend_ws http://phantex-backend:8000;
        proxy_pass         $backend_ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;    # keep alive for 24h

        # Strip backend server identity
        proxy_hide_header  Server;
        proxy_hide_header  X-Powered-By;
    }

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options        "DENY"    always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "0"       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss:; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ── Caching for static assets ─────────────────────────────
    # NOTE: Security headers from parent are NOT inherited into child
    # location blocks in nginx. We must repeat them here.
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires    1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options        "DENY"    always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection       "0"       always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss:; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # ── Gzip ──────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain application/json application/javascript text/css image/svg+xml;
    gzip_min_length 256;
}
