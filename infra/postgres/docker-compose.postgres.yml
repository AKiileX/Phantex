# Phantex — PostgreSQL 16 development stack
#
# Usage:
#   cd infra/postgres
#   docker compose -f docker-compose.postgres.yml up -d
#   docker compose -f docker-compose.postgres.yml down -v   # destroy data
#
# Connection:
#   Host: localhost:5432
#   Database: phantex
#   Superuser: phantex_admin / phantex-dev-password
#   App user:  phantex_app   / phantex-app-dev-password  (created by migration)
#
# Data persisted in Docker volume: phantex-pg-data
# To reset: docker compose -f docker-compose.postgres.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: phantex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: phantex
      POSTGRES_USER: phantex_admin
      POSTGRES_PASSWORD: phantex-dev-password
      # Performance tuning for dev (conservative)
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - phantex-pg-data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c" 
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "log_statement=ddl"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=16MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phantex_admin -d phantex"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  phantex-pg-data:
    driver: local
