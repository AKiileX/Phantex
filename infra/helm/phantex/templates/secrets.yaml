{{- /*
  Optional Helm-managed secrets. If you prefer external secret management
  (Vault, AWS Secrets Manager, sealed-secrets), set createSecrets: false
  and provide existingSecret names instead.
*/ -}}
{{- if .Values.secrets.create | default false }}
apiVersion: v1
kind: Secret
metadata:
  name: phantex-db-credentials
  labels:
    {{- include "phantex.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.secrets.dbPassword | required "secrets.dbPassword is required when secrets.create=true" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: phantex-jwt
  labels:
    {{- include "phantex.labels" . | nindent 4 }}
type: Opaque
data:
  secret: {{ .Values.secrets.jwtSecretValue | required "secrets.jwtSecretValue is required when secrets.create=true" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: phantex-sensor-token
  labels:
    {{- include "phantex.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.secrets.sensorToken | required "secrets.sensorToken is required when secrets.create=true" | b64enc | quote }}
{{- end }}
