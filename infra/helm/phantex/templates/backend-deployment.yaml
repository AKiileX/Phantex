# Phantex Backend — Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "phantex.fullname" . }}-backend
  labels:
    {{- include "phantex.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "phantex.selectorLabels" (dict "name" "phantex-backend" "release" .Release.Name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "phantex.selectorLabels" (dict "name" "phantex-backend" "release" .Release.Name) | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "phantex.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds | default 45 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.backend.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.backend.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.backend.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.backend.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "phantex.selectorLabels" (dict "name" "phantex-backend" "release" .Release.Name) | nindent 14 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "phantex.image" (dict "global" .Values.global "image" .Values.backend.image "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.backend.port }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # ── PostgreSQL ──
            - name: PHANTEX_DB_HOST
              value: {{ .Values.postgresql.host | quote }}
            - name: PHANTEX_DB_PORT
              value: {{ .Values.postgresql.port | default 5432 | quote }}
            - name: PHANTEX_DB_NAME
              value: {{ .Values.postgresql.database | quote }}
            - name: PHANTEX_DB_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: PHANTEX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.existingSecretKey }}
            # ── Kafka ──
            - name: PHANTEX_KAFKA_BOOTSTRAP
              value: {{ .Values.kafka.bootstrapServers | quote }}
            # ── JWT ──
            - name: PHANTEX_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.jwtSecret.existingSecret }}
                  key: {{ .Values.secrets.jwtSecret.existingSecretKey }}
            # ── Redis ──
            {{- if .Values.redis.url }}
            - name: PHANTEX_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- else if .Values.redis.host }}
            - name: PHANTEX_REDIS_URL
              value: {{ printf "redis://%s:%d/0" .Values.redis.host (.Values.redis.port | int) | quote }}
            {{- end }}
            # ── ClickHouse ──
            {{- if .Values.clickhouse.host }}
            - name: PHANTEX_CLICKHOUSE_HOST
              value: {{ .Values.clickhouse.host | quote }}
            - name: PHANTEX_CLICKHOUSE_PORT
              value: {{ .Values.clickhouse.httpPort | default 8123 | quote }}
            - name: PHANTEX_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.existingSecret }}
                  key: {{ .Values.clickhouse.existingSecretKey }}
            {{- end }}
            # ── Neo4j ──
            {{- if .Values.neo4j.uri }}
            - name: PHANTEX_NEO4J_URI
              value: {{ .Values.neo4j.uri | quote }}
            - name: PHANTEX_NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.neo4j.existingSecret }}
                  key: {{ .Values.neo4j.existingSecretKey }}
            {{- end }}
            # ── CORS ──
            - name: PHANTEX_CORS_ORIGINS
              value: "https://{{ .Values.ingress.host }}"
          {{- with .Values.backend.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
