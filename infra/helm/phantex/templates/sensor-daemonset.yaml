{{- if .Values.sensor.enabled }}
# Phantex Sensor — DaemonSet (runs on every node)
# Requires privileged for eBPF kernel probe attachment.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "phantex.fullname" . }}-sensor
  labels:
    {{- include "phantex.labels" . | nindent 4 }}
    app.kubernetes.io/component: sensor
spec:
  selector:
    matchLabels:
      {{- include "phantex.selectorLabels" (dict "name" "phantex-sensor" "release" .Release.Name) | nindent 6 }}
  updateStrategy:
    type: {{ .Values.sensor.updateStrategy.type }}
    rollingUpdate:
      maxUnavailable: {{ .Values.sensor.updateStrategy.rollingUpdate.maxUnavailable | quote }}
  template:
    metadata:
      labels:
        {{- include "phantex.selectorLabels" (dict "name" "phantex-sensor" "release" .Release.Name) | nindent 8 }}
        app.kubernetes.io/component: sensor
    spec:
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- toYaml .Values.sensor.tolerations | nindent 8 }}
      serviceAccountName: {{ include "phantex.serviceAccountName" . }}
      automountServiceAccountToken: false
      containers:
        - name: sensor
          image: {{ include "phantex.image" (dict "global" .Values.global "image" .Values.sensor.image "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            privileged: false
            capabilities:
              add:
                - BPF
                - PERFMON
                - NET_ADMIN
                - SYS_PTRACE
                - SYS_RESOURCE
              drop:
                - ALL
          args:
            - "--config"
            - "/etc/phantex/sensor.yaml"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PHANTEX_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: phantex-sensor-token
                  key: token
            - name: PHANTEX_TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "phantex.fullname" . }}-sensor-config
                  key: tenant_id
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/phantex
              readOnly: true
            - name: bpf
              mountPath: /sys/fs/bpf
            - name: debug
              mountPath: /sys/kernel/debug
              readOnly: true
          resources:
            {{- toYaml .Values.sensor.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "phantex.fullname" . }}-sensor-config
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: debug
          hostPath:
            path: /sys/kernel/debug
            type: Directory
{{- end }}
