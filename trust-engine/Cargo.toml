[package]
name = "phantex-trust-engine"
version = "0.1.0"
edition = "2021"
authors = ["Phantex <starxsec@proton.me>"]
description = "High-performance in-memory trust graph engine for Phantex"
license = "Apache-2.0"

[[bin]]
name = "phantex-trust-engine"
path = "src/main.rs"

[dependencies]
# gRPC
tonic = { version = "0.13", features = ["tls-ring"] }
prost = "0.13"
prost-types = "0.13"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Graph data structure
petgraph = "0.7"

# Concurrent hash map (lock-free reads)
dashmap = "6"

# Serialization for snapshots
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Encryption for snapshot at rest
aes-gcm = "0.10"
rand = "0.9"
hex = "0.4"

# UUID handling
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# gRPC streaming
tokio-stream = "0.1"

# Configuration
figment = { version = "0.10", features = ["toml", "env"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Metrics
once_cell = "1"

[build-dependencies]
tonic-build = "0.13"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "trust_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
